<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/signuppage.css">
</head>
<body>

    <!-- Background Decorative Images -->
    <div class="background">
        <img src="left-top.png" class="decor left-top">
        <img src="right-bottom.png" class="decor right-bottom">
    </div>

    <!-- Sign Up Card -->
    <div class="container">
        <div class="card">

            <h2>Sign Up</h2>
            <p class="subtitle">Please enter your details</p>

            <form>
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>

                <input type="button" onclick="location.href='dashboard.html'" class="button" value="Sign in">
            </form>

            <p class="bottom-text">Already have an account? <a href="loginpage.html">Log In</a></p>

        </div>
    </div>

</body>
</html>
