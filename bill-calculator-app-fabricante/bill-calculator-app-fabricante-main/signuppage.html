<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="css/signuppage.css"/>
</head>
<body>

  <!-- Background Decorative Images -->
  <div class="background">
    <img src="left-top.png" class="decor left-top">
    <img src="right-bottom.png" class="decor right-bottom">
  </div>

  <!-- Sign Up Card -->
  <div class="container">
    <div class="card">
      <h2>Sign Up</h2>
      <p class="subtitle">Please enter your details</p>

      <form onsubmit="handleRegister(event)">
        <input type="text" id="reg_name" placeholder="Name" required />
        <input type="email" id="reg_email" placeholder="Email Address" required />
        <input type="password" id="reg_password" placeholder="Password" required />
        <input type="password" id="reg_confirm_password" placeholder="Confirm Password" required />

        <input type="submit" class="button" value="Sign Up" />
      </form>

      <p class="bottom-text">Already have an account? <a href="loginpage.html">Log In</a></p>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Initialize Supabase client -->
  <script>
    const supabaseUrl = "https://aueqdiqxezfxwcvmhjey.supabase.co";
    const supabaseKey = "sb_publishable_4DM9-7c0TnBIloC5mjW7tA_ChoszsvG";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    document.addEventListener("DOMContentLoaded", async () => {
      await redirectIfAuthenticated();
    });

    async function handleRegister(event) {
      event.preventDefault(); // prevent form reload

      const name = document.getElementById("reg_name").value;
      const email = document.getElementById("reg_email").value;
      const password = document.getElementById("reg_password").value;
      const confirmPassword = document.getElementById("reg_confirm_password").value;

      if (!name || !email || !password || !confirmPassword) {
        alert("Please fill in all fields!");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters long!");
        return;
      }

      const submitBtn = document.querySelector('input[type="submit"].button');
      const originalValue = submitBtn.value;
      submitBtn.value = "Registering...";
      submitBtn.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: name },
          },
        });

        if (error || !data.user) {
          alert("Registration failed: " + (error ? error.message : "Unknown error"));
          submitBtn.value = originalValue;
          submitBtn.disabled = false;
          return;
        }

        alert("Registration successful! Please check your email to verify your account, then login.");
        window.location.href = "loginpage.html";
      } catch (err) {
        alert("An error occurred: " + err.message);
        submitBtn.value = originalValue;
        submitBtn.disabled = false;
      }
    }

    async function redirectIfAuthenticated() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = "dashboard.html";
      }
    }
  </script>
</body>
</html>
