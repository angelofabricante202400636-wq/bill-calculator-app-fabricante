<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bill Calculator</title>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <div class="background">
        <div class="sidebar">
            <img src="icons/home.png" alt="Home" onclick="location.href='dashboard.html'" style="cursor:pointer;">
            <img src="icons/profile.png" alt="profile" onclick="location.href='profile.html'" style="cursor:pointer;">
            <img src="icons/calculator.png" alt="calculator" onclick="location.href='calculator.html'" style="cursor:pointer;">
            <img src="icons/settings.png" alt="settings" onclick="location.href='settings.html'" style="cursor:pointer;">
        </div>
        
    <div class="container">
        <div class="card">
            <h1 class="title">ELECTRIC BILL<br>CALCULATOR</h1>

            <button class="profile-btn">Profile</button>

            <div class="profile-box">
                <div class="avatar">
                    <img src="profile.png" alt="profile">
                </div>

                <form>
                    <input type="text" placeholder="FullName">
                    <input type="number" placeholder="Age">
                    <input type="text" placeholder="Contact">
                    <input type="text" placeholder="Gender">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
