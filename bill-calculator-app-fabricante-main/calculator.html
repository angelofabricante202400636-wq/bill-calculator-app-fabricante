<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" type="text/css" href="css/calculator.css" />
  <title>Electric Bill Calculator</title>
</head>
<body>
  <div class="sidebar-wrapper">
    <div class="sidebar">
      <ul>
<li><a href="dashboard.html"><img src="icons/home.png" alt="Dashboard Icon"></a></li>
<li><a href="calculator.html"><img src="icons/calculator.png" alt="Calculator Icon"></a></li>
<li><a href="profile.html"><img src="icons/profile.png" alt="Profile Icon"></a></li>
<li><a href="settings.html"><img src="icons/settings.png" alt="settings"></a></li>
      </ul>
    </div>
  </div>

  <div class="container">
    <h1>Electric Bill Calculator</h1>

    <form onsubmit="event.preventDefault();">
      <label for="month">Month:</label>
      <input id="month" type="text" placeholder="January" required /><br />

      <label for="power_consumption">Power Consumption (kWh):</label>
      <input id="power_consumption" type="number" step="0.01" placeholder="Enter power consumption" required /><br />

      <label for="cost_per_kwh">Cost per kilowatt-hour (₱):</label>
      <input id="cost_per_kwh" type="number" step="0.01" placeholder="Enter cost per kWh" required />

      <br />
      <!-- use the id in CSS instead of an unused class -->
      <button id="btn_calculate" type="button">Calculate</button>
    </form>

    <!-- use #result in CSS instead of .result -->
    <div id="result"></div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Initialize Supabase client
    const supabaseUrl = "https://aueqdiqxezfxwcvmhjey.supabase.co";
    const supabaseKey = "sb_publishable_4DM9-7c0TnBIloC5mjW7tA_ChoszsvG";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "loginpage.html";
      }
    });

    document.getElementById("btn_calculate").addEventListener("click", async function () {
      let month = document.getElementById("month");
      let power_consumption = document.getElementById("power_consumption");
      let cost_per_kwh = document.getElementById("cost_per_kwh");
      let result = document.getElementById("result");

      // Validate inputs
      if (!month.value || !power_consumption.value || !cost_per_kwh.value) {
        alert("Please fill in all fields!");
        return;
      }

      // Get current user
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        alert("You must be logged in to save calculations!");
        window.location.href = "loginpage.html";
        return;
      }

      // Calculate result
      let result_value = parseFloat(cost_per_kwh.value) * parseFloat(power_consumption.value);

      // Display result message
      result.innerHTML = `Your electric bill is: ₱ ${result_value.toFixed(2)}`;

      // Save to Supabase
      try {
        const { data, error } = await supabaseClient
          .from("calculations")
          .insert([
            {
              user_id: user.id,
              month: month.value,
              power_consumption: parseFloat(power_consumption.value),
              cost_per_kwh: parseFloat(cost_per_kwh.value),
              result: result_value,
            },
          ])
          .select();

        if (error) {
          console.error("Error saving calculation:", error);
          alert("Calculation saved locally, but failed to save to database: " + error.message);
        } else {
          console.log("Calculation saved:", data);
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Error saving calculation: " + error.message);
      }

      // Show calculation history table
      let table = document.getElementById("myTable");
      if (!table) {
        result.innerHTML += `
          <h3>Calculation History</h3>
          <table id="myTable" border="1">
            <thead>
              <tr>
                <th>Month</th>
                <th>Power Consumption (kWh)</th>
                <th>Cost Per kWh (₱)</th>
                <th>Result (₱)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        `;
        table = document.getElementById("myTable");
      }

      // Insert new row at top (after header)
      const row = table.insertRow(1);
      row.insertCell(0).innerHTML = month.value;
      row.insertCell(1).innerHTML = parseFloat(power_consumption.value).toFixed(2);
      row.insertCell(2).innerHTML = "₱ " + parseFloat(cost_per_kwh.value).toFixed(2);
      row.insertCell(3).innerHTML = "₱ " + result_value.toFixed(2);

      // Clear form inputs
      month.value = "";
      power_consumption.value = "";
      cost_per_kwh.value = "";
    });

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = "loginpage.html";
    }
  </script>
</body>
</html>
