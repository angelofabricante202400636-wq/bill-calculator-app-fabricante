<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bill Calculator – Settings</title>
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <!-- Sidebar with background -->
    <div class="sidebar-wrapper">
        <div class="sidebar">
            <img src="icons/home.png" alt="Home" onclick="location.href='dashboard.html'">
            <img src="icons/profile.png" alt="profile" onclick="location.href='profile.html'">
            <img src="icons/calculator.png" alt="calculator" onclick="location.href='calculator.html'">
            <img src="icons/settings.png" alt="settings" onclick="location.href='settings.html'">
        </div>
    </div>

    <div class="container">
        <div class="calculator-header">
            <span class="calc-icon">⚡</span>
            <span class="calc-title">Electric Bill Calculator</span>
        </div>

        <div class="panel">
            <h1 class="main-title">ELECTRIC BILL<br>CALCULATOR</h1>
            <div class="sub-title">Settings</div>

            <div class="settings-grid">
                <input type="text" placeholder="Add Email Address">
                <input type="text" placeholder="Update Username">
                <input type="text" placeholder="Add Contact Number">
                <input type="password" placeholder="Update Password">
                <input type="text" placeholder="Add Facebook Account">
                <button class='logout-btn' onclick="location.href='landingpage.html'">Log out</button>
                <input type="text" placeholder="Change Language">
            </div>
        </div>
    </div>
</body>

</html>
