<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Calculator Login</title>
    <link rel="stylesheet" href="css/loginpage.css">
</head>
<body>

    <div class="container">
        <div class="form-container">

            <h1>Welcome Back</h1>
            <p>Please enter your details</p>

            <form>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <a href="recoverpage.html" class="forgot-password">Forgot password?</a>
            </form>

            <input type="button" onclick="location.href='dashboard.html'" class="button" value="Sign in">
            
            <button class="google-signin">Sign in with Google</button>

            <p class="signup">
                Don't have an account? <a href="signuppage.html">Sign up</a>
            </p>

        </div>
    </div>

</body>
</html>
